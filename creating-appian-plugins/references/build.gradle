// Working Gradle build for an Appian plug-in JAR.
// Verified against Gradle 9.6.1 on Windows with JAVA_HOME = JDK 25.
//
// REQUIRED companion settings.gradle — the foojay plugin is NOT optional:
//
//   plugins {
//     id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
//   }
//   rootProject.name = 'my-appian-plugin'
//
// Without it the Java 17 toolchain below only resolves if a JDK 17 already
// happens to sit in ~/.gradle/jdks or on the machine. Gradle cannot download
// one without a toolchain repository: a clean machine fails with
// "No matching toolchains found", and Gradle 10 turns it into a hard error.
// This failure is invisible on the author's machine and appears for whoever
// clones the repo next.
//
// Other companion files:
//   gradle.properties  -> pluginVersion / appianSdkVersion / appianMinVersion
//   src/main/resources/appian-plugin.xml  with <version>@pluginVersion@</version>
//
// Build:  ./gradlew clean build
// Output: build/libs/<rootProject.name>-<pluginVersion>.jar
//
// Expect ~100 javac warnings of the form
//   warning: unknown enum constant Data.K_CONTENT
//   reason: class file for com.appiancorp.suiteapi.resources.Data not found
// on every compile. The SDK jar references a class it does not ship. Harmless
// and unavoidable — do not go hunting for a broken dependency.

plugins {
  id 'java'
}

group = 'com.yourco.appian.plugins'
version = providers.gradleProperty('pluginVersion').get()

// ---------------------------------------------------------------------------
// Java 17 is not a preference. Every class in appian-plug-in-sdk 26.3 is
// bytecode major 61 (Java 17); the container runs Java 17. Anything newer
// throws UnsupportedClassVersionError at deploy or first invocation.
//
// A toolchain is used rather than sourceCompatibility so the build compiles AND
// tests on a real JDK 17. That additionally prevents use of post-17 APIs, which
// compile fine under --release but fail at runtime. Gradle downloads JDK 17 on
// demand, so JAVA_HOME may point at any JDK.
// ---------------------------------------------------------------------------
java {
  toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

// A dedicated configuration for "libraries that must travel inside the plug-in".
// Using this instead of runtimeClasspath keeps compile-only annotation artifacts
// (error_prone_annotations, checker-qual, jsr305 ...) out of the shipped JAR
// while still pulling real transitive dependencies.
configurations {
  pluginLib
  implementation.extendsFrom pluginLib
}

// Annotation-only artifacts arrive transitively from many libraries (gson pulls
// error_prone_annotations, guava pulls checker-qual and jsr305 ...). They have
// no runtime role, so exclude them at the configuration level — excluding them
// on one dependency misses the copy a different dependency drags in.
configurations.pluginLib {
  exclude group: 'com.google.errorprone'
  exclude group: 'org.checkerframework'
  exclude group: 'com.google.code.findbugs'
  exclude group: 'org.jetbrains', module: 'annotations'
}

dependencies {
  // PROVIDED by the Appian container. Must never be bundled: shipping a second
  // copy of com.appiancorp.* collides with the container's own classes.
  // NOTE: the Maven Central *search index* does not list this artifact. It is
  // published; verify with
  //   curl https://repo1.maven.org/maven2/com/appian/appian-plug-in-sdk/maven-metadata.xml
  compileOnly "com.appian:appian-plug-in-sdk:${appianSdkVersion}"

  // The SDK jar contains ZERO javax.servlet and ZERO javax.xml.bind entries
  // (verified by listing the artifact). The two lines below are therefore
  // MANDATORY for their module types, not conveniences — without them the code
  // does not compile. Both are container-provided at runtime, so compileOnly.

  // Required for any <servlet> module. javax, NOT jakarta.
  // compileOnly 'javax.servlet:javax.servlet-api:3.1.0'

  // Required for any <datatype> module. javax.xml.bind was REMOVED from the JDK
  // in Java 11, so on the Java 17 toolchain above a CDT will not compile
  // without this even though the annotation looks like a JDK builtin.
  // compileOnly 'javax.xml.bind:jaxb-api:2.3.1'

  // Connected system / integration plug-ins need BOTH artifacts:
  //   connected-systems-core   -> interfaces + ExecutionContext, IntegrationResponse,
  //                               IntegrationError   (com.appian.connectedsystems.templateframework.sdk.*)
  //   connected-systems-client -> the Simple* abstract base classes you actually
  //                               extend            (com.appian.connectedsystems.simplified.sdk.*)
  // connected-systems-client contains NO HTTP client - bring your own (e.g. OkHttp)
  // as a pluginLib dependency.
  // compileOnly 'com.appian:connected-systems-core:1.10.0'
  // compileOnly 'com.appian:connected-systems-client:1.4.0'

  // Third-party libraries that must ship inside META-INF/lib.
  // Includes Guava / Apache Commons / Log4j / SLF4J / JSON libs: the container
  // still carries those but they are deprecated-provided, so bundle them to pin
  // your own version rather than inheriting whatever Appian ships.
  pluginLib 'com.google.code.gson:gson:2.14.0'
  pluginLib 'org.apache.commons:commons-text:1.15.0'

  testImplementation "com.appian:appian-plug-in-sdk:${appianSdkVersion}"
  testImplementation platform('org.junit:junit-bom:5.11.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Sources contain non-ASCII (labels, i18n defaults) often enough that leaving
// javac on the platform default charset makes builds machine-dependent.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Single source of truth for the version: substitute @pluginVersion@ into
// appian-plugin.xml so the descriptor can never drift from the JAR name.
tasks.named('processResources', ProcessResources) {
  def tokens = [
    pluginVersion   : project.version.toString(),
    appianMinVersion: providers.gradleProperty('appianMinVersion').get(),
  ]
  inputs.properties(tokens)
  filesMatching('appian-plugin.xml') {
    filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: tokens)
  }
}

// ---------------------------------------------------------------------------
// Required JAR layout:
//   /appian-plugin.xml     <- root; if absent Appian ignores the JAR silently
//   /com/yourco/...        <- your classes and .properties bundles
//   /META-INF/lib/*.jar    <- dependencies as WHOLE nested JARs, not loose classes
// ---------------------------------------------------------------------------
tasks.named('jar', Jar) {
  duplicatesStrategy = DuplicatesStrategy.FAIL

  into('META-INF/lib') { from(configurations.pluginLib) }

  manifest {
    attributes(
      'Implementation-Title'  : project.name,
      'Implementation-Version': project.version.toString(),
      // Stops the Spring-DM layer in the plug-in container creating and
      // publishing an application context for this bundle.
      'Spring-Context'        : '*;publish-context:=false',
    )
  }
}

tasks.named('test', Test) { useJUnitPlatform() }

// ---------------------------------------------------------------------------
// Guard rails. You cannot deploy to Appian from here, so check mechanically
// the two things that fail silently on a real server.
// ---------------------------------------------------------------------------

// 1. Bytecode ceiling — including inside every bundled JAR. A dependency built
//    for Java 21 fails at class-load time, often only when first invoked.
tasks.register('verifyBytecodeVersion') {
  group = 'verification'
  description = 'Fails if any class in the JAR or its bundled libs exceeds Java 17 bytecode.'
  def jarProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
  inputs.file(jarProvider)
  doLast {
    def limit = 61 // Java 17
    def violations = []
    def majorOf = { byte[] h -> ((h[6] & 0xFF) << 8) | (h[7] & 0xFF) }
    // Entries under META-INF/versions/<n>/ are never loaded by a Java 17 JVM.
    def exemptMultiRelease = { String n ->
      def m = (n =~ /^META-INF\/versions\/(\d+)\//); m && (m[0][1] as int) > 17
    }
    def jarFile = jarProvider.get().asFile
    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
      zip.entries().each { e ->
        if (e.directory) return
        if (e.name.endsWith('.class')) {
          def b = zip.getInputStream(e).withCloseable { it.readNBytes(8) }
          if (b.length == 8 && majorOf(b) > limit && !exemptMultiRelease(e.name)) {
            violations << "${jarFile.name}!${e.name} -> major ${majorOf(b)}"
          }
        } else if (e.name.startsWith('META-INF/lib/') && e.name.endsWith('.jar')) {
          zip.getInputStream(e).withCloseable { raw ->
            def zis = new java.util.zip.ZipInputStream(raw)
            def n
            while ((n = zis.nextEntry) != null) {
              if (n.directory || !n.name.endsWith('.class')) continue
              if (n.name.endsWith('module-info.class')) continue
              def b = zis.readNBytes(8)
              if (b.length == 8 && majorOf(b) > limit && !exemptMultiRelease(n.name)) {
                violations << "${e.name}!${n.name} -> major ${majorOf(b)}"
              }
            }
          }
        }
      }
    }
    if (violations) {
      throw new GradleException(
        "Classes requiring a JDK newer than 17 (Appian runs Java 17):\n  " +
        violations.take(25).join('\n  '))
    }
    logger.lifecycle('verifyBytecodeVersion: OK')
  }
}

// 2. Descriptor placement, version agreement, and that the SDK did not leak in.
tasks.register('verifyPluginManifest') {
  group = 'verification'
  description = 'Asserts appian-plugin.xml is at the JAR root, versioned, and no SDK was bundled.'
  def jarProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
  inputs.file(jarProvider)
  def expected = project.version.toString()
  doLast {
    new java.util.zip.ZipFile(jarProvider.get().asFile).withCloseable { zip ->
      def entry = zip.getEntry('appian-plugin.xml')
      if (entry == null) {
        throw new GradleException(
          'appian-plugin.xml missing from the JAR root. Appian ignores such a JAR silently.')
      }
      def xml = zip.getInputStream(entry).withCloseable { it.text }
      if (xml.contains('@')) {
        throw new GradleException("Unsubstituted @token@ left in appian-plugin.xml:\n${xml}")
      }
      def m = (xml =~ /<version>\s*([^<\s]+)\s*<\/version>/)
      if (!m) throw new GradleException('appian-plugin.xml has no <version> element.')
      if (m[0][1] != expected) {
        throw new GradleException(
          "Version drift: descriptor says '${m[0][1]}', build is '${expected}'.")
      }
      def sdk = zip.entries().findAll {
        it.name.startsWith('META-INF/lib/') &&
          (it.name.contains('appian-plug-in-sdk') || it.name.contains('connected-systems'))
      }
      if (sdk) {
        throw new GradleException(
          "Appian SDK bundled into META-INF/lib (must be compileOnly): ${sdk*.name}")
      }
      logger.lifecycle("verifyPluginManifest: OK - version ${m[0][1]}")
    }
  }
}

// 3. Every class= in the descriptor names a class actually present in the JAR.
//    A typo'd or refactor-stale class attribute is a silent deploy failure:
//    the module simply never appears in Appian.
//    NOTE: groovy.xml.XmlParser must be fully qualified — Groovy 4 (Gradle 9)
//    removed XmlParser/XmlSlurper from the default imports.
tasks.register('verifyDescriptorClasses') {
  group = 'verification'
  description = 'Asserts every class= in appian-plugin.xml resolves to a class in the JAR.'
  def jarProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
  inputs.file(jarProvider)
  doLast {
    new java.util.zip.ZipFile(jarProvider.get().asFile).withCloseable { zip ->
      def entry = zip.getEntry('appian-plugin.xml')
      def xml = zip.getInputStream(entry).withCloseable { it.text }
      // Collect entry names as plain Strings — a Set<String>.contains(GString)
      // is ALWAYS false, which silently turns this check into a no-op.
      def present = zip.entries().collect { it.name.toString() } as Set
      def refs = (xml =~ /class\s*=\s*"([^"]+)"/).collect { it[1] } +
                 (xml =~ /<class>\s*([^<\s]+)\s*<\/class>/).collect { it[1] }
      if (refs.isEmpty()) {
        throw new GradleException('No class references found in appian-plugin.xml — check is a no-op.')
      }
      def missing = refs.findAll { !present.contains(it.replace('.', '/') + '.class') }
      if (missing) {
        throw new GradleException("Descriptor references classes not in the JAR: ${missing}")
      }
      logger.lifecycle("verifyDescriptorClasses: OK - ${refs.size()} class ref(s) resolved")
    }
  }
}

tasks.named('check') {
  dependsOn 'verifyBytecodeVersion', 'verifyPluginManifest', 'verifyDescriptorClasses'
}

